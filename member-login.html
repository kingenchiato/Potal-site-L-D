<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会員ログイン｜児発連</title>
  <meta name="description" content="児発連会員専用ページへのログイン。会員IDとパスワードにより、研修資料・会議資料・各種様式等にアクセスできます。">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="page-wrap">
      <div class="container">
        <nav class="breadcrumb" aria-label="パンくずリスト">
          <ol>
            <li><a href="index.html">HOME</a></li>
            <li>会員ログイン</li>
          </ol>
        </nav>

        <div class="login-box reveal">
          <h1>会員ログイン</h1>
          <p class="sub">児発連加盟事業所向け 会員専用ページ</p>

          <div id="login-msg" class="alert" hidden role="alert"></div>

          <form id="login-form" class="form-stack" action="#" method="post">
            <div class="form-row" style="grid-template-columns:1fr;gap:6px;border:0;padding:0;">
              <label class="form-label" for="userid" style="padding:0;">会員ID</label>
              <input class="form-control" type="text" id="userid" name="userid" autocomplete="username" required>
            </div>
            <div class="form-row" style="grid-template-columns:1fr;gap:6px;border:0;padding:14px 0 0;">
              <label class="form-label" for="password" style="padding:0;">パスワード</label>
              <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div class="form-actions" style="padding-top:18px;">
              <button class="btn btn-primary btn-block" type="submit">ログイン</button>
            </div>
          </form>

          <div class="panel panel--note" style="margin-top:22px;padding:14px;">
            <p style="margin:0;font-size:12px;color:var(--ink-3);line-height:1.8;">
              本ページは会員IDおよびパスワードによる閲覧制限を行っています。ID・パスワードをお持ちでない方は、<a href="join.html">入会案内</a>をご確認のうえ事務局までお問い合わせください。<br>
              パスワードをお忘れの場合も、事務局（<a href="contact.html">お問い合わせ</a>）までご連絡ください。
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
